name: Compilar app del iPad

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compilar (sin firmar; Sideloadly firma con tu Apple ID)
        working-directory: ios
        run: |
          xcodebuild \
            -project PantallaExtra.xcodeproj \
            -scheme PantallaExtra \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PantallaExtra.app Payload/
          zip -qry PantallaExtra.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PantallaExtra-ipa
          path: ios/PantallaExtra.ipa
          retention-days: 30
